[project]
name = "bayesflow-hssm-tutorial"
version = "0.1.0"
description = "Shared uv environment for the BayesFlow / HSSM / PyMC tutorials."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "bayesflow>=2.0",
    "hssm",
    "jax",
    "ipykernel",
    "ipywidgets",
    # Declared explicitly rather than relied on transitively via hssm: these are
    # imported directly by the Day 2/3 tutorials, and the ArviZ 1.x lower bound
    # is load-bearing (1.0 removed plot_posterior/plot_ppc/waic and changed the
    # default interval from 94% HDI to 89% ETI).
    "pymc>=6.2",
    "arviz>=1.2",
    "bambi>=0.19",
    "ssm-simulators>=0.13.2",
    "pymc-extras>=0.11",
    "matplotlib",
    "pandas",
]
