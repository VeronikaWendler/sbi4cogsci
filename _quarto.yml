project:
  type: website
  output-dir: _site
  # Positive globs only. Anything not matched (READMEs, CONTRIBUTING.md) stays
  # repo-only. Quarto also skips any path segment starting with "_" — files as
  # well as dirs — regardless of these globs; that is how solution and draft
  # notebooks (`_*.ipynb`) are kept off the site. Prefer the `_` prefix over
  # "!" negations here: negations work on Quarto 1.10 but silently stopped
  # short on 1.9, and CI installs an unpinned version.
  render:
    - "*.qmd"                       # top-level site pages
    - "tutorials/index.qmd"         # tutorials catalog
    - "tutorials/*/*.ipynb"         # tutorial site pages (baked notebooks…)
    - "tutorials/*/*.qmd"           # …or display-only qmd pages

website:
  title: "SBI-4-CogSci"
  favicon: images/graphics/sbi4cogsci-icon.png
  navbar:
    logo: images/graphics/sbi4cogsci-logo.png
    logo-alt: "Logo"
    title: false
    pinned: true
    background: white
    foreground: "#111827"
    left:
      - href: index.qmd
        text: Overview
      - href: schedule.qmd
        text: Schedule
      - href: tutorials/index.qmd
        text: Tutorials
      - href: organizers.qmd
        text: Organizers
      - href: application.qmd
        text: Application
      - href: contact.qmd
        text: Contact
  page-footer:
    left: |
      <div class="footer-brand">
        <div class="footer-title">SBI4CogSci Summer School 2026</div>
        <div class="footer-meta">July 27-31, 2026</div>
      </div>
    center: |
      <img src="images/graphics/sbi4cogsci-icon.png" height="80" alt="SBI4CogSci icon" />
    right: |
      <div class="footer-funder">
        Supported by the <br><strong>William K. and Katherine W. Estes Fund</strong>
      </div>

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    grid:
      body-width: 1000px
      margin-width: 0px
      gutter-width: 1.5rem
    smooth-scroll: true
    mainfont: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif